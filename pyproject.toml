[project]
name = "operant"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
required-version = ">=0.13.0,<0.14.0"
package = false

[dependency-groups]
dev = ["ruff==0.15.22"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
[tool.ruff.lint.per-file-ignores]
"score_orchestration.py" = ["E501"]
"score_orchestration_judge.py" = ["E501"]
