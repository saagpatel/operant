name: Publish MCP package to npm

# Publishes saagar-operant-mcp from mcp/ with npm trusted publishing (OIDC) and
# npm provenance. The npm trusted publisher must name this repository, this
# file name (publish-npm.yml, case-sensitive) and the `npm` environment.
# Tags use an `mcp-v` prefix so benchmark tags such as v0.9-public-lab never
# trigger a package release.
on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    name: Check, pack, reproduce and inventory
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No dependency cache in a release job: every install comes from the lockfile.

      - name: Require the tag to match mcp/package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./mcp/package.json").version')"
          test "$TAG" = "mcp-v$version" || { echo "::error::tag $TAG does not match package version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check MCP package
        run: make check-mcp

      - name: Pack the release tarball from a clean install
        working-directory: mcp
        run: |
          rm -rf node_modules dist
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:cli
          mkdir -p ../dist-npm
          npm pack --pack-destination ../dist-npm

      - name: Reproducible-build check (rebuild from a fresh clone, compare SHA-256)
        run: |
          mkdir -p supply-chain
          python3 mcp/scripts/check_reproducible_build.py --subdir mcp --reference dist-npm \
            --report supply-chain/reproducible-build.json \
            --build 'npm ci --ignore-scripts --no-audit --no-fund && npm run build:cli && npm pack --pack-destination {out}'

      - name: Generate CycloneDX SBOM from the lockfile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm sbom --prefix mcp --package-lock-only --omit dev \
            --sbom-format cyclonedx --sbom-type application \
            > "supply-chain/saagar-operant-mcp-$VERSION.cdx.json"
          (cd dist-npm && sha256sum ./*) | tee supply-chain/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-npm
          path: dist-npm/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain
          path: supply-chain/
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest build provenance and SBOM
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write      # Sigstore signing certificate
      attestations: write  # store attestations on this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-npm
          path: dist-npm/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain
          path: supply-chain/

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-npm/*.tgz
          # Storage records need an organization-owned repository.
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-npm/*.tgz
          sbom-path: supply-chain/saagar-operant-mcp-${{ needs.build.outputs.version }}.cdx.json
          create-storage-record: false

  publish:
    name: Publish to npm
    needs: [build, attest]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Require an npm that supports trusted publishing (11.5.1 or later)
        run: |
          npm_version="$(npm --version)"
          node -e 'const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }' "$npm_version"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-npm
          path: dist-npm/

      - name: Publish the exact attested tarball
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
        # short-lived publish credential through the trusted publisher.
        run: npm publish "./dist-npm/saagar-operant-mcp-$VERSION.tgz" --provenance --access public
