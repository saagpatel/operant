name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff

      - name: Compile Python files
        run: python -m py_compile operant_lab/*.py operant_lab_cli.py run_codex_app.py run_codex_cli.py run_operant.py run_orchestration.py run_suite.py score_operant.py score_orchestration.py score_orchestration_judge.py score_suite.py score_variance.py rescore_orchestration.py gen_cases.py draft_validate.py selftest.py

      - name: Run selftest
        run: python selftest.py

      - name: Run Ruff
        run: ruff check operant_lab operant_lab_cli.py run_codex_app.py run_codex_cli.py run_operant.py run_orchestration.py run_suite.py score_operant.py score_orchestration.py score_orchestration_judge.py score_suite.py score_variance.py rescore_orchestration.py gen_cases.py draft_validate.py selftest.py
