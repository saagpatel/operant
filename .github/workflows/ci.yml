name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install tooling
        # Ruff 0.16 widens the implicit ruleset and makes unrelated baseline
        # files fail. Keep CI on the last-green line until that migration is
        # reviewed as its own cleanup change.
        run: python -m pip install --no-deps ruff==0.15.22

      - name: Compile Python files
        run: python -m compileall -q operant_lab *.py

      - name: Run selftest
        run: |
          python selftest.py
          python -m unittest discover -p 'test_*.py'
          python verify_evaluation_split.py

      - name: Run Ruff
        # These two files are hash-bound into public evidence. Preserve their
        # exact bytes until the next governed public-artifact regeneration.
        run: >-
          ruff check operant_lab *.py
          --extend-per-file-ignores
          'score_orchestration.py:E501,score_orchestration_judge.py:E501'

      - name: Install MCP dependencies
        run: npm ci --prefix mcp

      - name: Verify generated MCP artifacts
        run: |
          npm --prefix mcp run build:corpus
          npm --prefix mcp run build:wellknown
          git diff --exit-code -- mcp/src/corpus.generated.ts mcp/src/well-known.generated.ts

      - name: Verify MCP contract
        run: |
          npm --prefix mcp run typecheck
          npm --prefix mcp test
          npm --prefix mcp run build:cli
          npm --prefix mcp run probe:mcp
          npm --prefix mcp run verify:manifest
          npm --prefix mcp run parity
