name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.13.0

      - name: Check Python
        run: make check-python
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  full-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install uv
        run: python -m pip install uv==0.13.0

      - name: Run full check
        run: make check

  # Branch protection requires a single check named `verify`; it passes only when the
  # Python matrix and the full check both passed.
  verify:
    needs: [python, full-check]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to pass
        run: test "${{ needs.python.result }}" = "success" && test "${{ needs.full-check.result }}" = "success"
